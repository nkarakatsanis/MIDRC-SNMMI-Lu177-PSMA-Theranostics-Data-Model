name: Publish theranostics model release

on:
  push:
    branches: [cdis]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theranostics-model-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'nkarakatsanis/MIDRC-SNMMI-Lu177-PSMA-Theranostics-Data-Model' && github.ref == 'refs/heads/cdis'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate the model and build downloads
        run: |
          python -m pip install -r extensions/lu177_psma/v0.3.0/scripts/requirements.txt
          python extensions/lu177_psma/v0.3.0/scripts/validate_model.py
          python scripts/build_dictionary_docs.py --check
          python scripts/build_release_assets.py --output dist
      - name: Publish the versioned development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_version="$(tr -d '\r\n' < VERSION)"
          release_tag="v${release_version}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release already exists; existing releases are never overwritten."
            exit 1
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Tag already exists; existing tags are never moved."
            exit 1
          fi
          gh release create "$release_tag" \
            --target "$GITHUB_SHA" \
            --title "$release_version" \
            --notes-file "releases/${release_version}.md" \
            --draft --prerelease
          gh release upload "$release_tag" dist/*
          gh release edit "$release_tag" --draft=false --prerelease
